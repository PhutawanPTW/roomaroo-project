<!-- Reset Password Component -->
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4 font-thai">
  <div class="bg-white shadow-xl rounded-lg overflow-hidden max-w-md w-full">

    <!-- Header -->
    <div class="text-center p-6 border-b border-gray-200">
      <div class="flex flex-row items-center justify-center mb-4">
        <img src="assets/images/fd276adb-7ae8-40b1-9c24-62c7273f0232.png" alt="Roomaroo Logo"
          class="w-16 h-16 rounded-full object-cover">
        <h1 class="text-lg text-gray-900 font-thai align-middle mt-1 -ml-1">
          <span class="font-bold">Room</span><span class="font-normal">aroo</span>
        </h1>
      </div>
      <h2 class="text-xl font-semibold text-gray-900">ตั้งรหัสผ่านใหม่</h2>
      <p class="text-sm text-gray-600 mt-2">กรุณาตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
      <p class="text-xs text-blue-600 mt-1">หลังจากเปลี่ยนรหัสผ่านแล้ว คุณจะต้องเข้าสู่ระบบใหม่เพื่อความปลอดภัย</p>
    </div>

    <!-- Form -->
    <div class="p-6">
      <!-- Error Message -->
      <div *ngIf="errorMessage"
        class="flex items-center gap-2 bg-red-50 border border-red-400 text-red-700 rounded-md px-4 py-2 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 flex-shrink-0" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12A9 9 0 113 12a9 9 0 0118 0z" />
        </svg>
        <span class="text-sm">{{ errorMessage }}</span>
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage"
        class="flex items-center gap-2 bg-green-50 border border-green-400 text-green-700 rounded-md px-4 py-2 mb-4">
        <svg class="w-5 h-5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span class="text-sm">{{ successMessage }}</span>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- New Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">รหัสผ่านใหม่</label>
          <div class="relative">
            <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword"
              placeholder="อย่างน้อย 10 ตัวอักษร, A-Z, a-z, 0-9, สัญลักษณ์พิเศษ"
              class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition duration-200 bg-gray-50 font-english text-sm"
              [class.border-red-500]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
              autocomplete="new-password">
            <button type="button" (click)="toggleNewPasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none">
              <svg *ngIf="!showNewPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
              <svg *ngIf="showNewPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                </path>
              </svg>
            </button>
          </div>
          <p *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
            class="mt-1 text-sm text-red-600">
            กรุณากรอกรหัสผ่านให้ถูกต้องตามข้อกำหนด
          </p>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">ยืนยันรหัสผ่านใหม่</label>
          <div class="relative">
            <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword"
              placeholder="กรอกรหัสผ่านอีกครั้งเพื่อยืนยัน"
              class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition duration-200 bg-gray-50 font-english text-sm"
              [class.border-red-500]="resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched"
              autocomplete="new-password">
            <button type="button" (click)="toggleConfirmPasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none">
              <svg *ngIf="!showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
              <svg *ngIf="showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                </path>
              </svg>
            </button>
          </div>
          <p *ngIf="resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched"
            class="mt-1 text-sm text-red-600">
            รหัสผ่านไม่ตรงกัน
          </p>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="isLoading || resetForm.invalid || !oobCode"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center"
          [class.cursor-not-allowed]="isLoading || resetForm.invalid || !oobCode">

          <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white mr-2" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>

          <span>{{ isLoading ? 'กำลังบันทึก...' : 'บันทึกรหัสผ่านใหม่' }}</span>
        </button>
      </form>

      <!-- Back to Login -->
      <div class="text-center mt-6">
        <button (click)="goToLogin()"
          class="text-blue-500 hover:text-blue-600 font-semibold hover:underline transition duration-200 text-sm">
          กลับไปหน้าเข้าสู่ระบบ
        </button>
      </div>
    </div>
  </div>
</div>
