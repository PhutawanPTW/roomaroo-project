<ng-container *ngIf="!isAuthPage()">
  <app-navbar></app-navbar>
</ng-container>

<div class="w-full max-w-7xl mx-auto px-4 pb-12 font-thai font-english">
  <!-- Slider section -->
  <div class="relative overflow-hidden h-[260px] sm:h-[340px] md:h-[420px] lg:h-[480px] mb-10">
    <div class="relative h-full overflow-hidden rounded-lg">
      <div class="flex h-full transition-transform duration-500"
        [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
        <div *ngFor="let img of sliderImages" class="w-full h-full flex-shrink-0">
          <img [src]="img.src" [alt]="img.alt" class="w-full h-full object-cover object-center" />
        </div>
      </div>
    </div>
    <!-- Navigation dots -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-10">
      <button *ngFor="let img of sliderImages; let i = index"
        class="w-3 h-3 rounded-full bg-white/70 border border-gray-300 transition-all duration-200"
        [class.bg-yellow-400]="i === currentSlide" (click)="goToSlide(i)"></button>
    </div>
  </div>

  <!-- Rest of the content -->
  <section class="mb-10 fade-in">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl md:text-2xl font-medium font-thai section-title">หอพักแนะนำ</h2>
      <button (click)="viewAllRecommended()" class="view-all-btn text-sm font-medium font-thai text-gray-600">
        ดูทั้งหมด
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    </div>
    <!-- Skeleton: Recommended -->
    <div *ngIf="isLoadingRecommended" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div *ngFor="let s of [1,2,3,4]" class="bg-white border border-black/10 rounded-lg p-4 animate-pulse">
        <div class="w-full h-48 mb-3 bg-gray-200 rounded-lg"></div>
        <div class="h-4 bg-gray-200 rounded w-2/3 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
        <div class="h-3 bg-gray-200 rounded w-1/3 mb-3"></div>
        <div class="flex gap-2 mt-auto">
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
        </div>
      </div>
    </div>

    <div *ngIf="!isLoadingRecommended" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <ng-container *ngFor="let dorm of displayedRecommended">
        <div
          class="bg-white shadow hover:shadow-lg transition p-4 flex flex-col border border-black/10 h-full card-hover-effect rounded-lg">
          <div class="w-full h-48 mb-3 overflow-hidden rounded-lg cursor-pointer"
            [routerLink]="['/dorm-detail', dorm.id]">
            <img [src]="dorm.image" alt="dorm"
              class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" />
          </div>

          <div class="flex-1 flex flex-col">
            <div class="text-[#6D6D6D] font-bold text-base flex items-start price-container h-[48px] font-english"
              [innerHTML]="getSafePriceHtml(dorm.price)"></div>

            <div class="font-medium text-lg mb-1 font-thai min-h-[28px] line-clamp-2 cursor-pointer"
              [routerLink]="['/dorm-detail', dorm.id]">
              {{ dorm.name }}
            </div>

            <div class="text-gray-500 text-sm mb-1 font-thai min-h-[20px] line-clamp-2">{{ dorm.zone }}</div>

            <div class="text-gray-400 text-xs font-thai mb-3">อัพเดทล่าสุด {{ dorm.date }}</div>

            <div class="mt-auto flex items-end">
              <div class="flex items-end">
                <span class="text-sm font-bold text-gray-700 font-english relative top-0.5">5.0</span>
                <span class="ml-3 flex relative top-[0.05rem]">
                  <ng-container *ngFor="let star of getStars(dorm.rating)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="#FDD836" viewBox="0 0 20 20" class="w-5 h-5 inline">
                      <path
                        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.967a1 1 0 00.95.69h4.175c.969 0 1.371 1.24.588 1.81l-3.38 2.455a1 1 0 00-.364 1.118l1.287 3.966c.3.922-.755 1.688-1.54 1.118l-3.38-2.454a1 1 0 00-1.175 0l-3.38 2.454c-.784.57-1.838-.196-1.54-1.118l1.287-3.966a1 1 0 00-.364-1.118L2.05 9.394c-.783-.57-.38-1.81.588-1.81h4.175a1 1 0 00.95-.69l1.286-3.967z" />
                    </svg>
                  </ng-container>
                </span>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </section>

  <section class="mb-10 fade-in">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl md:text-2xl font-medium font-thai section-title">หอพักที่อัพเดทล่าสุด</h2>
      <button (click)="viewAllLatest()" class="view-all-btn text-sm font-medium font-thai text-gray-600">
        ดูทั้งหมด
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    </div>
    <!-- Skeleton: Latest -->
    <div *ngIf="isLoadingLatest" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div *ngFor="let s of [1,2,3,4]" class="bg-white border border-black/10 rounded-lg p-4 animate-pulse">
        <div class="w-full h-48 mb-3 bg-gray-200 rounded-lg"></div>
        <div class="h-4 bg-gray-200 rounded w-2/3 mb-2"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
        <div class="h-3 bg-gray-200 rounded w-1/3 mb-3"></div>
        <div class="flex gap-2 mt-auto">
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
          <div class="w-5 h-5 bg-gray-200 rounded"></div>
        </div>
      </div>
    </div>

    <div *ngIf="!isLoadingLatest" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <ng-container *ngFor="let dorm of displayedLatest">
        <div
          class="bg-white shadow hover:shadow-lg transition p-4 flex flex-col border border-black/10 h-full card-hover-effect rounded-lg">
          <div class="w-full h-48 mb-3 overflow-hidden rounded-lg cursor-pointer"
            [routerLink]="['/dorm-detail', dorm.id]">
            <img [src]="dorm.image" alt="dorm"
              class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" />
          </div>

          <div class="flex-1 flex flex-col">
            <div class="text-[#6D6D6D] font-bold text-base flex items-start price-container h-[48px] font-english"
              [innerHTML]="getSafePriceHtml(dorm.price)"></div>

            <div class="font-medium text-lg mb-1 font-thai min-h-[28px] line-clamp-2 cursor-pointer"
              [routerLink]="['/dorm-detail', dorm.id]">
              {{ dorm.name }}
            </div>

            <div class="text-gray-500 text-sm mb-1 font-thai min-h-[20px] line-clamp-2">{{ dorm.zone }}</div>

            <div class="text-gray-400 text-xs font-thai mb-3">อัพเดทล่าสุด {{ dorm.date }}</div>

            <div class="mt-auto flex items-end">
              <div class="flex items-end">
                <span class="text-sm font-bold text-gray-700 font-english relative top-0.5">5.0</span>
                <span class="ml-3 flex relative top-[0.05rem]">
                  <ng-container *ngFor="let star of getStars(dorm.rating)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="#FDD836" viewBox="0 0 20 20" class="w-5 h-5 inline">
                      <path
                        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.967a1 1 0 00.95.69h4.175c.969 0 1.371 1.24.588 1.81l-3.38 2.455a1 1 0 00-.364 1.118l1.287 3.966c.3.922-.755 1.688-1.54 1.118l-3.38-2.454a1 1 0 00-1.175 0l-3.38 2.454c-.784.57-1.838-.196-1.54-1.118l1.287-3.966a1 1 0 00-.364-1.118L2.05 9.394c-.783-.57-.38-1.81.588-1.81h4.175a1 1 0 00.95-.69l1.286-3.967z" />
                    </svg>
                  </ng-container>
                </span>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </section>

  <!-- Compare Popup -->
  <app-compare-popup></app-compare-popup>
</div>
