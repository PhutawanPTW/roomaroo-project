<ng-container *ngIf="!isAuthPage()">
  <app-navbar></app-navbar>
</ng-container>

<!-- Banner Slideshow -->
<div class="w-full max-w-full mx-auto pb-8 font-thai font-english">
  <div class="relative overflow-hidden shadow-lg h-[260px] sm:h-[340px] md:h-[420px] lg:h-[480px]">
    <div class="flex transition-transform duration-700 ease-in-out h-full"
      [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
      <div *ngFor="let img of sliderImages" class="min-w-full h-full">
        <img [src]="img.src" [alt]="img.alt" class="w-full h-full object-cover object-center" />
      </div>
    </div>
    <!-- Dot Indicator -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-10">
      <button *ngFor="let img of sliderImages; let i = index"
        class="w-3 h-3 rounded-full bg-white/70 border border-gray-300 transition-all duration-200"
        [class.bg-yellow-400]="i === currentSlide" (click)="goToSlide(i)"></button>
    </div>
  </div>
</div>

<div class="w-full max-w-7xl mx-auto px-4 pb-12 font-thai font-english">
  <!-- หอพักแนะนำ -->
  <section class="mb-10">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl md:text-2xl font-medium font-thai">หอพักแนะนำ</h2>
      <button (click)="viewAllRecommended()"
        class="flex items-center text-base md:text-lg font-medium font-thai text-[#68ACFD] hover:text-blue-500 transition">
        ดูทั้งหมด
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-5 h-5 ml-1 inline-block align-middle">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <ng-container *ngFor="let dorm of recommendedDorms">
        <div class="bg-white shadow hover:shadow-lg transition p-4 flex flex-col h-full border border-black/10">
          <img [src]="dorm.image" alt="dorm" class="w-full h-48 object-cover mb-3" />
          <div class="text-[#6D6D6D] font-bold text-base mb-1 font-english min-h-[44px]"
            [innerHTML]="getPriceHtml(dorm.price)"></div>
          <div class="font-bold text-lg mb-1 font-thai">{{ dorm.name }}</div>
          <div class="text-gray-500 text-sm mb-1 font-thai">{{ dorm.location }}</div>
          <div class="text-gray-400 text-xs font-thai mb-1">อัพเดทล่าสุด {{ dorm.date }}</div>
          <div class="mt-auto flex items-end justify-between">
            <div class="flex items-end">
              <span class="text-sm font-bold text-gray-700 font-english relative top-1">{{ dorm.rating.toFixed(1)
                }}</span>
              <span class="ml-3 flex relative top-0.5">
                <ng-container *ngFor="let star of getStars(dorm.rating)">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="#FDD836" viewBox="0 0 20 20" class="w-5 h-5 inline">
                    <path
                      d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.967a1 1 0 00.95.69h4.175c.969 0 1.371 1.24.588 1.81l-3.38 2.455a1 1 0 00-.364 1.118l1.287 3.966c.3.922-.755 1.688-1.54 1.118l-3.38-2.454a1 1 0 00-1.175 0l-3.38 2.454c-.784.57-1.838-.196-1.54-1.118l1.287-3.966a1 1 0 00-.364-1.118L2.05 9.394c-.783-.57-.38-1.81.588-1.81h4.175a1 1 0 00.95-.69l1.286-3.967z" />
                  </svg>
                </ng-container>
              </span>
            </div>
            <button (click)="viewDormDetail(dorm)"
              class="text-xs font-thai text-gray-400 hover:text-[#68ACFD] font-medium transition-colors flex items-center relative top-0.5">
              ดูรายละเอียด
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </section>

  <!-- หอพักที่อัพเดทล่าสุด -->
  <section class="mb-10">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl md:text-2xl font-medium font-thai">หอพักที่อัพเดทล่าสุด</h2>
      <button (click)="viewAllLatest()"
        class="flex items-center text-base md:text-lg font-medium font-thai text-[#68ACFD] hover:text-blue-500 transition">
        ดูทั้งหมด
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="w-5 h-5 ml-1 inline-block align-middle">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <ng-container *ngFor="let dorm of latestDorms">
        <div class="bg-white shadow hover:shadow-lg transition p-4 flex flex-col h-full border border-black/10">
          <img [src]="dorm.image" alt="dorm" class="w-full h-48 object-cover mb-3" />
          <div class="text-[#6D6D6D] font-bold text-base mb-1 font-english min-h-[44px]"
            [innerHTML]="getPriceHtml(dorm.price)"></div>
          <div class="font-bold text-lg mb-1 font-thai">{{ dorm.name }}</div>
          <div class="text-gray-500 text-sm mb-1 font-thai">{{ dorm.location }}</div>
          <div class="text-gray-400 text-xs font-thai mb-1">อัพเดทล่าสุด: {{ dorm.date }}</div>
          <div class="mt-auto flex items-end justify-between">
            <div class="flex items-end">
              <span class="text-sm font-bold text-gray-700 font-english relative top-1">{{ dorm.rating.toFixed(1)
                }}</span>
              <span class="ml-3 flex relative top-0.5">
                <ng-container *ngFor="let star of getStars(dorm.rating)">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="#FDD836" viewBox="0 0 20 20" class="w-5 h-5 inline">
                    <path
                      d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.967a1 1 0 00.95.69h4.175c.969 0 1.371 1.24.588 1.81l-3.38 2.455a1 1 0 00-.364 1.118l1.287 3.966c.3.922-.755 1.688-1.54 1.118l-3.38-2.454a1 1 0 00-1.175 0l-3.38 2.454c-.784.57-1.838-.196-1.54-1.118l1.287-3.966a1 1 0 00-.364-1.118L2.05 9.394c-.783-.57-.38-1.81.588-1.81h4.175a1 1 0 00.95-.69l1.286-3.967z" />
                  </svg>
                </ng-container>
              </span>
            </div>
            <button (click)="viewDormDetail(dorm)"
              class="text-xs font-thai text-gray-400 hover:text-[#68ACFD] font-medium transition-colors flex items-center relative top-0.5">
              ดูรายละเอียด
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </section>
</div>
<router-outlet></router-outlet>
