<!-- src/app/components/login/login.component.html -->
<!-- Main Background Container -->
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4 font-thai">
  <!-- Card Container -->
  <div class="bg-white shadow-xl overflow-hidden max-w-4xl w-full flex">

    <!-- Left Section - Login Form -->
    <div class="w-[50%] p-8 flex flex-col justify-center">
      <!-- Header Section -->
      <div class="text-center mb-6">
        <!-- Logo -->
        <div class="flex flex-row items-center justify-center">
          <img src="assets/images/fd276adb-7ae8-40b1-9c24-62c7273f0232.png" alt="Roomaroo Logo"
            class="w-20 h-20 rounded-full object-cover">
          <h1 class="text-lg text-gray-900 font-thai align-middle mt-1 -ml-1">
            <span class="font-bold">Room</span><span class="font-normal">aroo</span>
          </h1>
        </div>
        <!-- User Type Badge -->
        <div class="mt-2">
          <span class="inline-block bg-blue-100 text-blue-800 text-sm font-medium px-3 py-1 rounded-full">
            เข้าสู่ระบบสำหรับ{{ getUserTypeDisplayText() }}
          </span>
        </div>
      </div>



      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email -->
        <div>
          <input type="email" formControlName="email" placeholder="E-mail"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition duration-200 bg-gray-50 font-english text-black placeholder-gray-400"
            [class.border-red-500]="hasError('email', 'required') || hasError('email', 'email')">
          <p *ngIf="getErrorMessage('email') && (loginForm.get('email')?.touched || loginForm.get('email')?.dirty)"
            class="mt-1 text-sm text-red-600">{{ getErrorMessage('email') }}</p>
        </div>

        <!-- Password -->
        <!-- Password -->
        <div>
          <input type="password" formControlName="password" placeholder="Password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition duration-200 bg-gray-50 font-english text-black placeholder-gray-400"
            [class.border-red-500]="hasError('password', 'required')">
          <p *ngIf="getErrorMessage('password') && (loginForm.get('password')?.touched || loginForm.get('password')?.dirty)"
            class="mt-1 text-sm text-red-600">{{ getErrorMessage('password') }}</p>

          <!-- Error Message -->
          <div *ngIf="errorMessage"
            class="flex items-center gap-2 bg-red-50 border border-red-400 text-red-700 rounded-md px-4 py-2 mt-2 mb-2 fade-in"
            style="font-size: 15px;">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 flex-shrink-0" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12A9 9 0 113 12a9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage }}</span>
          </div>
        </div>

        <!-- Login Button -->
        <button type="submit" [disabled]="isLoginLoading || loginForm.invalid"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center"
          [class.cursor-not-allowed]="isLoginLoading || loginForm.invalid">

          <svg *ngIf="isLoginLoading" class="animate-spin h-5 w-5 text-white mr-2" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>

          <span>เข้าสู่ระบบ</span>
        </button>

        <!-- Divider -->
        <div class="relative mt-1 mb-2">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500 font-thai">หรือ</span>
          </div>
        </div>

        <!-- Google Button -->
        <button type="button" (click)="connectWithGoogle()" [disabled]="isGoogleLoading"
          class="w-full bg-[#434FAA] hover:bg-[#3b4798] disabled:bg-gray-400 text-white font-normal py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center space-x-3 font-thai mt-4">
          <!-- Loading Spinner for Google Button -->
          <svg *ngIf="isGoogleLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          <img *ngIf="!isGoogleLoading" src="assets/icon/google.png" alt="Google" class="w-5 h-5">
          <span>{{ isGoogleLoading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบด้วยบัญชี Google' }}</span>
        </button>
        <div *ngIf="errorMessageGoogle" class="text-red-600 text-sm mt-1 text-center">{{ errorMessageGoogle }}</div>
      </form>

      <!-- Footer -->
      <div class="text-center mt-6 font-noto-sans">
        <span class="text-gray-600 text-sm font-thai">ยังไม่สมัครเป็นสมาชิกใช่ไหม? </span>
        <button (click)="onRegister()"
          class="text-blue-500 hover:text-blue-600 font-semibold hover:underline transition duration-200 text-sm font-thai">
          {{ getRegisterText() }}
        </button>
      </div>
    </div>

    <!-- Right Section 50% - Image Slider -->
    <div class="w-[50%] relative p-6 flex items-center justify-center">
      <!-- Image Slider -->
      <div class="slider-container">
        <div class="slider-wrapper" [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
          <div *ngFor="let image of sliderImages" class="slider-slide">
            <img [src]="image.src" [alt]="image.alt" class="w-full h-full object-cover">
          </div>
        </div>

        <!-- Slider Dots -->
        <div class="slider-dots">
          <button *ngFor="let image of sliderImages; let i = index" class="slider-dot"
            [class.active]="i === currentSlide" (click)="goToSlide(i)">
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
