<app-navbar></app-navbar>

<div class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
  <!-- Floating Header - Bottom Position (Mobile First) -->
  <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-30 px-4 w-full max-w-2xl">
    <div class="bg-white/95 backdrop-blur-sm rounded-xl px-3 md:px-6 py-2 md:py-3 shadow-lg border border-white/20">
      <div class="flex items-center justify-center gap-2 flex-wrap">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
          <span class="text-gray-700 font-medium text-sm md:text-base">
            หอพักทั้งหมด <span class="font-bold text-blue-600">{{ getTotalDormitories() }}</span> แห่ง
          </span>
        </div>
        <div class="hidden sm:block w-px h-4 bg-gray-300 mx-2"></div>
        <div class="hidden sm:flex items-center gap-1 text-xs md:text-sm text-gray-600">
          <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span>คลิกที่หมุดเพื่อดูรายละเอียด</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Map Container - Responsive Height -->
  <div class="relative w-full h-screen">
    <!-- Loading Overlay -->
    <div 
      *ngIf="isLoading" 
      class="absolute inset-0 bg-gradient-to-br from-blue-50/90 to-white/90 backdrop-blur-sm flex items-center justify-center z-50">
      <div class="text-center px-4">
        <!-- ใช้เฉพาะ dot dot ไม่ใช้ตัวหมุน -->
        <div class="bg-white/80 backdrop-blur-sm rounded-lg px-4 md:px-6 py-3 shadow-lg">
          <p class="text-gray-700 font-medium text-sm md:text-base">กำลังโหลดแผนที่และข้อมูลหอพัก...</p>
          <div class="flex justify-center mt-2">
            <div class="flex space-x-1">
              <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0s;"></div>
              <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
              <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Overlay - Responsive -->
    <div 
      *ngIf="error" 
      class="absolute inset-0 bg-gradient-to-br from-red-50/90 to-white/90 backdrop-blur-sm flex items-center justify-center z-50">
      <div class="text-center max-w-md mx-auto px-4">
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-6 md:p-8 shadow-xl border border-red-100">
          <div class="text-red-500 mb-4 md:mb-6">
            <div class="w-16 h-16 md:w-20 md:h-20 mx-auto mb-3 md:mb-4 bg-red-100 rounded-full flex items-center justify-center">
              <svg class="w-8 h-8 md:w-10 md:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
              </svg>
            </div>
          </div>
          <h3 class="text-lg md:text-xl font-bold text-gray-900 mb-2 md:mb-3">เกิดข้อผิดพลาด</h3>
          <p class="text-sm md:text-base text-gray-600 mb-4 md:mb-6 leading-relaxed">{{ error }}</p>
          <button 
            (click)="retryLoad()"
            class="px-6 md:px-8 py-2.5 md:py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl hover:from-blue-600 hover:to-blue-700 transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl font-medium text-sm md:text-base">
            <span class="flex items-center gap-2 justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
              ลองใหม่อีกครั้ง
            </span>
          </button>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div 
      #mapContainer 
      class="w-full h-full relative">
    </div>
  </div>
</div>
