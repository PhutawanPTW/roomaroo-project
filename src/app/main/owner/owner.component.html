<app-navbar></app-navbar>
<div class="w-full max-w-6xl mx-auto px-4 py-6 font-thai font-english">
  <h2 class="text-lg font-thai font-medium mb-2 flex items-end gap-2 font-normal">
    รายการหอพักของฉัน
    <span class="text-gray-400 text-sm font-normal mb-0.5">({{ myDorms.length }})</span>
  </h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
    <ng-container *ngFor="let dorm of myDorms; let i = index">
      <div class="bg-white card-owner p-4 flex flex-col h-full border border-black/10 cursor-pointer group relative"
        (click)="viewDormDetail(dorm)">
        <img [src]="dorm.main_image_url || dorm.thumbnail_url || dorm.image || 'assets/images/default-dorm.jpg'" alt="dorm" class="w-full h-40 object-cover mb-3" />
        <div class="text-[#6D6D6D] font-bold text-base font-english min-h-[44px]"
          [innerHTML]="getPriceHtml(formatPriceString(dorm))"></div>
        <div class="font-semibold text-base mb-1 font-thai">{{ dorm.name || dorm.dorm_name }}</div>
        <div class="flex items-center mb-2">
          <button *ngIf="dorm.verified || dorm.is_verified"
            class="flex items-center gap-2 bg-[#4CAF50] text-white text-sm px-2 py-1.5 rounded-md font-thai font-bold transition select-none">
            <span class="">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="11" fill="#fff" />
                <path d="M7.5 12.5L11 16L17 10" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </span>
            <span class="font-thai text-sm font-normal">ตรวจสอบแล้ว</span>
          </button>
          <button *ngIf="!(dorm.verified || dorm.is_verified)"
            class="flex items-center gap-2 bg-[#F44336] text-white text-sm px-2 py-1.5 rounded-md font-thai font-bold transition select-none">
            <span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="11" fill="#fff" />
                <path d="M8 8L16 16M16 8L8 16" stroke="#F44336" stroke-width="2.5" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </span>
            <span class="font-thai text-sm font-normal">ยังไม่ตรวจสอบ</span>
          </button>
        </div>
        <div class="text-gray-400 text-sm font-thai mb-2">อัพเดทล่าสุด: {{ dorm.updated || dorm.date || dorm.updated_at }}</div>
        <div class="flex items-center justify-between mt-auto w-full">
          <div class="flex items-center">
            <span class="text-base font-bold text-black font-english mr-2">{{ (dorm.rating || 5.0).toFixed(1) }}</span>
            <span class="flex gap-0.5">
              <ng-container *ngFor="let star of getStars(dorm.rating || 5.0)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="#FDD836" viewBox="0 0 20 20" class="w-4 h-4">
                  <path
                    d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.967a1 1 0 00.95.69h4.175c.969 0 1.371 1.24.588 1.81l-3.38 2.455a1 1 0 00-.364 1.118l1.287 3.966c.3.922-.755 1.688-1.54 1.118l-3.38-2.454a1 1 0 00-1.175 0l-3.38 2.454c-.784.57-1.838-.196-1.54-1.118l1.287-3.966a1 1 0 00-.364-1.118L2.05 9.394c-.783-.57-.38-1.81.588-1.81h4.175a1 1 0 00.95-.69l1.286-3.967z" />
                </svg>
              </ng-container>
            </span>
          </div>
          <div class="flex items-center justify-end mt-auto w-full -mr-2">
            <div class="flex items-center -space-x-1">
              <button (click)="$event.stopPropagation(); onEditDorm(dorm)"
                class="w-8 h-8 p-0 flex items-center justify-center bg-transparent hover:opacity-80 transition">
                <img src="assets/svg/Edit.svg" alt="edit" class="w-5 h-5 hover:brightness-110 transition" />
              </button>
              <button (click)="$event.stopPropagation(); onDeleteDorm(dorm)"
                class="w-8 h-8 p-0 flex items-center justify-center bg-transparent hover:opacity-80 transition">
                <img src="assets/svg/Delete.svg" alt="delete" class="w-5 h-5 hover:brightness-110 transition" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>

<router-outlet></router-outlet>

<!-- Simple loader style -->
<style>
  .loader {
    border: 4px solid #e0e7ef;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }
</style>
