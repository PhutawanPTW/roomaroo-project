<app-navbar></app-navbar>
<div class="w-full max-w-7xl mx-auto px-4 py-8 font-thai font-english">
  <!-- Owner Profile Section -->
  <div class="bg-white rounded-lg shadow-md p-6 mb-8 flex items-center gap-6" *ngIf="currentUser">
    <div class="relative">
      <img
        [src]="currentUser.photoURL || 'https://ui-avatars.com/api/?name=' + (currentUser.displayName || currentUser.username || 'O') + '&background=E0E7EF&color=374151&size=128'"
        alt="owner profile"
        class="w-28 h-28 rounded-full object-cover border-2 border-blue-400 shadow"
      />
      <button
        class="absolute bottom-1 right-1 bg-blue-600 text-white rounded-full p-2 shadow hover:bg-blue-700 transition"
        [disabled]="uploadLoading"
        (click)="triggerFileInput(fileInput)"
        title="เปลี่ยนรูปโปรไฟล์"
        style="font-size: 1.1rem;"
      >
        <mat-icon>photo_camera</mat-icon>
      </button>
      <input
        #fileInput
        type="file"
        accept="image/*"
        class="hidden"
        (change)="onProfileImageSelected($event)"
      />
      <div *ngIf="uploadLoading" class="absolute inset-0 flex items-center justify-center bg-white/70 rounded-full">
        <span class="loader"></span>
      </div>
    </div>
    <div class="flex-1 min-w-0">
      <h1 class="text-2xl font-bold text-gray-800 mb-1 truncate">
        {{ currentUser.displayName || currentUser.username || 'เจ้าของหอพัก' }}
      </h1>
      <div class="flex items-center gap-4 text-gray-600 mb-1">
        <span class="flex items-center gap-2">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
          </svg>
          {{ currentUser.email }}
        </span>
        <span class="flex items-center gap-2" *ngIf="currentUser.username">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
          </svg>
          <span class="font-mono text-blue-600 font-semibold">{{ currentUser.username }}</span>
        </span>
      </div>
      <div class="text-sm text-gray-500">สถานะ <span class="text-green-600 font-semibold">เจ้าของหอพัก</span></div>
      <div *ngIf="uploadError" class="text-red-600 mt-2">{{ uploadError }}</div>
    </div>
  </div>

  <h2 class="text-xl font-thai font-semibold mb-2 flex items-end gap-2">
    รายการหอพักของฉัน
    <span class="text-gray-400 text-sm font-normal mb-0.5">({{ recommendedDorms.length }})</span>
  </h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <ng-container *ngFor="let dorm of recommendedDorms; let i = index">
      <div class="bg-white card-owner p-4 flex flex-col h-full border border-black/10 cursor-pointer group relative"
        (click)="viewDormDetail(dorm)">
        <img [src]="dorm.image" alt="dorm" class="w-full h-48 object-cover mb-3" />
        <div class="text-[#6D6D6D] font-bold text-base font-english min-h-[50px]"
          [innerHTML]="getPriceHtml(dorm.price)"></div>
        <div class="font-bold text-lg mb-2 font-thai">{{ dorm.name }}</div>
        <div class="flex items-center gap-4 mb-3">
          <button
            class="flex items-center gap-2 bg-[#4CAF50] text-white text-lg py-1 rounded transition w-40 justify-center select-none"
            style="font-family: 'Noto Sans Thai', sans-serif; font-weight: 400;">
            <span class="inline-block w-6 h-6 bg-white rounded-full flex items-center justify-center">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="12" fill="#fff" />
                <path d="M7.5 12.5L11 16L17 10" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </span>
            <span class="font-thai text-lg font-medium">ตรวจสอบแล้ว</span>
          </button>
        </div>
        <div class="text-gray-400 text-base font-thai">อัพเดทล่าสุด: {{ dorm.date }}</div>
        <div class="flex items-center mt-auto w-full">
          <span class="text-lg font-bold text-black font-english mr-2">{{ dorm.rating.toFixed(1) }}</span>
          <span class="flex">
            <ng-container *ngFor="let star of getStars(dorm.rating)">
              <svg xmlns="http://www.w3.org/2000/svg" fill="#FDD836" viewBox="0 0 20 20" class="w-6 h-6 inline">
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.967a1 1 0 00.95.69h4.175c.969 0 1.371 1.24.588 1.81l-3.38 2.455a1 1 0 00-.364 1.118l1.287 3.966c.3.922-.755 1.688-1.54 1.118l-3.38-2.454a1 1 0 00-1.175 0l-3.38 2.454c-.784.57-1.838-.196-1.54-1.118l1.287-3.966a1 1 0 00-.364-1.118L2.05 9.394c-.783-.57-.38-1.81.588-1.81h4.175a1 1 0 00.95-.69l1.286-3.967z" />
              </svg>
            </ng-container>
          </span>
          <span class="flex ml-10 items-center gap-0">
            <button (click)="$event.stopPropagation(); onEditDorm(dorm)"
              class="w-10 h-10 p-0 flex items-center justify-center bg-transparent hover:opacity-80 transition -mr-2">
              <img src="assets/svg/Edit.svg" alt="edit" class="w-5 h-5 hover:brightness-110 transition" />
            </button>
            <button (click)="$event.stopPropagation(); onDeleteDorm(dorm)"
              class="w-10 h-10 p-0 flex items-center justify-center bg-transparent hover:opacity-80 transition">
              <img src="assets/svg/Delete.svg" alt="delete" class="w-5 h-5 hover:brightness-110 transition" />
            </button>
          </span>
        </div>
      </div>
    </ng-container>
  </div>
</div>

<!-- Simple loader style -->
<style>
  .loader {
    border: 4px solid #e0e7ef;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
